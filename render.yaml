
services:
  - type: cron
    name: opportune-deadline-reminders
    runtime: python
    schedule: "0 7 * * *"
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py send_deadline_reminders
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: notifications@opportune.site
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: DEBUG
        value: "True"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
